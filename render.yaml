services:
  # Backend - Web Service
  - type: web
    name: decisionlens-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: FRONTEND_ORIGIN
        value: https://decisionlens-two.vercel.app,http://localhost:5173
      - key: PORT
        value: 10000
    healthCheckPath: /api/health
